name: Playwright Tests (nx)

# Dedicated run that exercises the nx path (`nx e2e`) instead of calling
# `playwright test` directly. Kept separate from playwright.yml so the proven
# direct-Playwright workflow stays untouched. Each workflow run has its own
# github.run_id, so this streams to TestDino as its own logical run — compare it
# side by side with the direct run.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: nx Shard ${{ matrix.shardIndex }} of ${{ matrix.shardTotal }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run tests via nx (stream to TestDino + Nx Cloud)
        env:
          TESTDINO_TOKEN: ${{ secrets.TESTDINO_TOKEN }}
          TESTDINO_SERVER_URL: https://analytics.testdino.com
          # Same ciRunId across all shards -> one logical run in TestDino
          TESTDINO_CI_RUN_ID: ${{ github.run_id }}
          # Nx Cloud CI auth. Without a CI access token the run is NOT recorded in
          # the Nx Cloud project (nxCloudId alone authorizes local auth, not CI writes).
          NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
          # Storedemo credentials for @ui tests (optional; @api tests need none)
          USERNAME: ${{ secrets.STOREDEMO_USERNAME }}
          PASSWORD: ${{ secrets.STOREDEMO_PASSWORD }}
          NEW_PASSWORD: ${{ secrets.STOREDEMO_NEW_PASSWORD }}
        # NO --skip-nx-cache: keeping the Nx Cloud connection alive is what makes the
        # run show up in the Nx Cloud project. Shard execution is still guaranteed
        # because the e2e target is marked non-cacheable in nx.json (targetDefaults),
        # so Playwright always runs and every shard streams to TestDino.
        run: npx nx e2e -- --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
