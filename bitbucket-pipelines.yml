# Bitbucket Pipelines — sharded Playwright run streaming live to TestDino.
# Docs: https://docs.testdino.com/guides/playwright-bitbucket
#
# Set these Repository variables (Repository settings -> Repository variables),
# Secured:
#   TESTDINO_TOKEN         your TestDino token
#   STOREDEMO_USERNAME     storedemo login (optional, for @ui tests)
#   STOREDEMO_PASSWORD     storedemo password (optional, for @ui tests)

image: mcr.microsoft.com/playwright:v1.54.1-jammy

definitions:
  caches:
    npm: ~/.npm
  steps:
    - step: &shard
        name: Playwright shard
        size: 2x
        max-time: 60
        caches:
          - npm
          - node
        script:
          - export SHARD=$((BITBUCKET_PARALLEL_STEP + 1))
          - export TOTAL=$BITBUCKET_PARALLEL_STEP_COUNT
          - export TESTDINO_SERVER_URL=https://analytics.testdino.com
          # Same ciRunId across all shards -> one logical run in TestDino
          - export TESTDINO_CI_RUN_ID=$BITBUCKET_BUILD_NUMBER
          - export USERNAME=$STOREDEMO_USERNAME
          - export PASSWORD=$STOREDEMO_PASSWORD
          - export NEW_PASSWORD=$STOREDEMO_NEW_PASSWORD
          - npm ci
          - npx playwright install --with-deps
          - npx playwright test --shard=$SHARD/$TOTAL

pipelines:
  default: &sharded-pipeline
    - parallel:
        steps:
          - step: { <<: *shard }
          - step: { <<: *shard }
          - step: { <<: *shard }
          - step: { <<: *shard }
  branches:
    main: *sharded-pipeline
  pull-requests:
    '**': *sharded-pipeline
  custom:
    manual-run: *sharded-pipeline
